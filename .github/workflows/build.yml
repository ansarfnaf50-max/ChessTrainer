name: Build Chess Trainer APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build Stockfish for Android arm64-v8a
        run: |
          set -ex
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ls "$TOOLCHAIN" | grep aarch64 || true
          export PATH="$TOOLCHAIN:$PATH"

          curl -L -o sf.tar.gz https://github.com/official-stockfish/Stockfish/archive/refs/tags/sf_16.1.tar.gz
          mkdir sf
          tar xzf sf.tar.gz -C sf --strip-components=1

          cd sf/src
          make -j"$(nproc)" build ARCH=armv8 COMP=ndk STRIP=llvm-strip
          llvm-strip stockfish
          file stockfish

          cd "$GITHUB_WORKSPACE"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp sf/src/stockfish app/src/main/jniLibs/arm64-v8a/libstockfish.so
          ls -l app/src/main/jniLibs/arm64-v8a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessTrainer-APK
          path: app/build/outputs/apk/debug/*.apk
